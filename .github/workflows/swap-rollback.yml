name: Revert Slot Swap (Staging -> Production)

on:
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_92CCFB243762432B982ACF52569ABFF0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_23FDAA897DD14958B942ED366CF685C9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5732C6EF7A9442ADB8E9DCD2C3C9E423 }}

      - name: Revert Slot Swap (Staging -> Production)
        run: |
          az webapp deployment slot swap \
            --resource-group rg-myapp-prd \
            --name myappkala \
            --slot staging \
            --target-slot production
